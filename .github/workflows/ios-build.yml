name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ios-ipa:
    # Ghim runner: RoboVM 2.3.20 chi on dinh voi Xcode 15.x.
    runs-on: macos-14
    defaults:
      run:
        working-directory: Client
    env:
      # Secret khong duoc dung truc tiep trong `if`, nen tinh san o day.
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Select Xcode 15.4
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Point Gradle at the Android SDK
        # settings.gradle co include 'android', nen Gradle can SDK khi cau hinh.
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Library/Android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          ./gradlew --no-daemon --version

      - name: Import signing certificate and provisioning profile
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          CERT="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"

          echo -n "$CERT_P12_BASE64" | base64 --decode -o "$CERT"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          # RoboVM 2.3.20 chi doc profile o duong dan cu, khong doc UserData/Xcode 16.
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/$(uuidgen).mobileprovision"
          ls -1 "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Build IPA
        env:
          IOS_SIGN_IDENTITY: ${{ secrets.IOS_SIGN_IDENTITY }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$HAS_SIGNING" = "true" ]; then
            ARGS+=("-PiosSignIdentity=$IOS_SIGN_IDENTITY")
            ARGS+=("-PiosProvisioningProfile=$IOS_PROVISIONING_PROFILE")
          else
            echo "::warning::Khong co secret ky. Build IPA KHONG KY - chi de kiem tra build, khong cai duoc len may that."
            ARGS+=("-PiosSkipSigning=true")
          fi
          ./gradlew --no-daemon --stacktrace ios:createIPA "${ARGS[@]}"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            Client/ios/build/robovm/**/*.ipa
            Client/ios/build/robovm/**/*.app
          if-no-files-found: warn
